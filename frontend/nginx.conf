limit_req_zone $binary_remote_addr zone=geo_api:10m rate=8r/s;
limit_req_status 429;
# A CDN must use trusted real-client-IP ranges before relying on per-viewer rate limits.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    location = /api/v1/feed-stream {
        limit_req zone=geo_api burst=40 nodelay;
        proxy_pass http://geo-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        limit_req zone=geo_api burst=40 nodelay;
        proxy_pass http://geo-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep the same-origin provider routes available to web and desktop builds.
    location ^~ /prop/ {
        limit_req zone=geo_api burst=40 nodelay;
        proxy_pass http://geo-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        add_header Cache-Control "no-store" always;
        proxy_pass http://geo-api:8080/healthz;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
