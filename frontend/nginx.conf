server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://geo-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fetch provider data same-origin; the map renders the geographic features itself.
    location = /prop/renders/current/mufd-normal-now.geojson {
        proxy_pass https://prop.kc2g.com/renders/current/mufd-normal-now.geojson;
        proxy_set_header Host prop.kc2g.com;
        proxy_ssl_server_name on;
    }
    location = /prop/api/stations.json {
        proxy_pass https://prop.kc2g.com/api/stations.json;
        proxy_set_header Host prop.kc2g.com;
        proxy_ssl_server_name on;
    }

    location /healthz { proxy_pass http://geo-api:8080/healthz; }
    location / { try_files $uri $uri/ /index.html; }
}
