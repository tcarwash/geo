[project]
name = "geo-backend"
version = "0.1.0"
description = "Self-hosted Geo dashboard API and public data adapters"
requires-python = ">=3.11"
dependencies = [
  "eccodes>=2.44,<3",
  "eccodeslib>=2.44,<3; sys_platform != 'win32'",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pydantic>=2.8,<3",
  "redis>=5,<7",
  "sgp4>=2.23,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "asgi-lifespan>=2,<3", "ruff>=0.8,<1"]
desktop = ["pyinstaller>=6.14,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
